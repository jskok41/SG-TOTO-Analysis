<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Matrix Screensaver">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    
    <!-- iOS 26 specific meta tags -->
    <meta name="apple-mobile-web-app-orientations" content="portrait">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Matrix">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgdmlld0JveD0iMCAwIDE5MiAxOTIiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxOTIiIGhlaWdodD0iMTkyIiBmaWxsPSIjMDAwMDAwIi8+Cjx0ZXh0IHg9Ijk2IiB5PSIxMDAiIGZvbnQtZmFtaWx5PSJDb3VyaWVyIE5ldyIgbW9ub3NwYWNlIGZvbnQtc2l6ZT0iNDgiIGZpbGw9IiMwMGZmMDAiIHRleHQtYW5jaG9yPSJtaWRkbGUiPk08L3RleHQ+Cjwvc3ZnPgo=">
    <title>Matrix Screensaver - iPhone 15 Pro Max iOS 26</title>
    
    <style>
        :root {
            --matrix-green: #00ff00;
            --matrix-dark: #000000;
            --matrix-bright: #ffffff;
            --safe-area-top: env(safe-area-inset-top);
            --safe-area-bottom: env(safe-area-inset-bottom);
            --safe-area-left: env(safe-area-inset-left);
            --safe-area-right: env(safe-area-inset-right);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--matrix-dark);
            overflow: hidden;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Courier New', monospace;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: var(--safe-area-top) var(--safe-area-right) var(--safe-area-bottom) var(--safe-area-left);
        }

        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        .controls {
            position: absolute;
            top: calc(var(--safe-area-top) + 20px);
            right: calc(var(--safe-area-right) + 20px);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .controls:hover {
            opacity: 1;
        }

        .control-btn {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid var(--matrix-green);
            color: var(--matrix-green);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            min-width: 80px;
            text-align: center;
        }

        .control-btn:hover {
            background: rgba(0, 255, 0, 0.4);
            transform: scale(1.05);
        }

        .control-btn.active {
            background: rgba(0, 255, 0, 0.6);
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .settings-panel {
            position: absolute;
            top: calc(var(--safe-area-top) + 20px);
            left: calc(var(--safe-area-left) + 20px);
            z-index: 10;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--matrix-green);
            border-radius: 12px;
            padding: 20px;
            color: var(--matrix-green);
            font-size: 12px;
            min-width: 250px;
            max-width: 300px;
            display: none;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .settings-panel.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .setting-item {
            margin-bottom: 15px;
        }

        .setting-item label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .setting-item input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(0, 255, 0, 0.2);
            outline: none;
        }

        .setting-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--matrix-green);
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        .setting-item input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--matrix-green);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        .setting-item input[type="color"] {
            width: 40px;
            height: 30px;
            border: 1px solid var(--matrix-green);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
        }

        .setting-value {
            font-size: 10px;
            color: #888;
            text-align: right;
        }

        .wake-indicator {
            position: absolute;
            bottom: calc(var(--safe-area-bottom) + 30px);
            left: 50%;
            transform: translateX(-50%);
            color: var(--matrix-green);
            font-size: 14px;
            text-align: center;
            z-index: 10;
            opacity: 0.7;
            animation: pulse 2s infinite;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .status-bar {
            position: absolute;
            top: var(--safe-area-top);
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
            z-index: 5;
            pointer-events: none;
        }

        .matrix-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(0, 255, 0, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 255, 0, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0, 255, 0, 0.02) 0%, transparent 50%);
            z-index: 2;
            pointer-events: none;
        }

        /* iPhone 15 Pro Max specific optimizations */
        @media screen and (device-width: 430px) and (device-height: 932px) {
            .controls {
                top: calc(var(--safe-area-top) + 15px);
                right: calc(var(--safe-area-right) + 15px);
            }
            
            .control-btn {
                padding: 6px 10px;
                font-size: 11px;
                min-width: 70px;
            }
            
            .settings-panel {
                top: calc(var(--safe-area-top) + 15px);
                left: calc(var(--safe-area-left) + 15px);
                padding: 15px;
                font-size: 11px;
                min-width: 220px;
            }
            
            .wake-indicator {
                bottom: calc(var(--safe-area-bottom) + 25px);
                font-size: 13px;
            }
        }

        /* Landscape mode adjustments */
        @media screen and (orientation: landscape) {
            .controls {
                top: calc(var(--safe-area-top) + 10px);
                right: calc(var(--safe-area-right) + 10px);
                flex-direction: row;
                gap: 8px;
            }
            
            .settings-panel {
                top: calc(var(--safe-area-top) + 10px);
                left: calc(var(--safe-area-left) + 10px);
                max-width: 250px;
            }
            
            .wake-indicator {
                bottom: calc(var(--safe-area-bottom) + 15px);
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            :root {
                --matrix-green: #00ff41;
            }
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            :root {
                --matrix-green: #ffffff;
            }
        }
    </style>
</head>
<body>
    <div class="status-bar"></div>
    <canvas id="matrix-canvas"></canvas>
    <div class="matrix-overlay"></div>
    
    <div class="controls">
        <button class="control-btn" id="pause-btn">⏸️ Pause</button>
        <button class="control-btn" id="settings-btn">⚙️ Settings</button>
        <button class="control-btn" id="fullscreen-btn">⛶ Fullscreen</button>
        <button class="control-btn" id="lock-btn">🔒 Lock</button>
    </div>

    <div class="settings-panel" id="settings-panel">
        <h3 style="margin-bottom: 15px; text-align: center; text-transform: uppercase; letter-spacing: 1px;">Matrix Settings</h3>
        
        <div class="setting-item">
            <label>Speed:</label>
            <input type="range" id="speed-slider" min="1" max="10" value="5">
            <div class="setting-value" id="speed-value">5</div>
        </div>
        
        <div class="setting-item">
            <label>Density:</label>
            <input type="range" id="density-slider" min="10" max="100" value="50">
            <div class="setting-value" id="density-value">50</div>
        </div>
        
        <div class="setting-item">
            <label>Character Size:</label>
            <input type="range" id="size-slider" min="8" max="24" value="14">
            <div class="setting-value" id="size-value">14</div>
        </div>
        
        <div class="setting-item">
            <label>Color:</label>
            <input type="color" id="color-picker" value="#00ff00">
        </div>
        
        <div class="setting-item">
            <label>Fade Speed:</label>
            <input type="range" id="fade-slider" min="1" max="20" value="10">
            <div class="setting-value" id="fade-value">10</div>
        </div>
        
        <div class="setting-item">
            <label>Glitch Effect:</label>
            <input type="checkbox" id="glitch-checkbox" checked>
        </div>
        
        <div class="setting-item">
            <label>Auto-lock:</label>
            <input type="checkbox" id="autolock-checkbox">
        </div>
    </div>

    <div class="wake-indicator">
        Tap to wake • Matrix Screensaver
    </div>

    <script>
        class MatrixScreensaverIOS26 {
            constructor() {
                this.canvas = document.getElementById('matrix-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.isPaused = false;
                this.isLocked = false;
                this.animationId = null;
                this.autoLockTimer = null;
                
                // Matrix characters - extended set for iOS 26
                this.chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+-=[]{}|;:,.<>?アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
                this.drops = [];
                
                // Settings
                this.settings = {
                    speed: 5,
                    density: 50,
                    charSize: 14,
                    color: '#00ff00',
                    fadeSpeed: 10,
                    glitch: true,
                    autolock: false
                };
                
                this.init();
                this.setupEventListeners();
                this.resizeCanvas();
                this.start();
            }

            init() {
                this.resizeCanvas();
                this.initializeDrops();
                this.setupAutoLock();
            }

            resizeCanvas() {
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                
                // Adjust for iPhone 15 Pro Max safe areas
                const safeAreaTop = window.safeAreaInsets?.top || 0;
                const safeAreaBottom = window.safeAreaInsets?.bottom || 0;
                
                this.canvas.style.width = '100vw';
                this.canvas.style.height = '100vh';
            }

            initializeDrops() {
                this.drops = [];
                const columns = Math.floor(this.canvas.width / this.settings.charSize);
                
                for (let i = 0; i < columns; i++) {
                    this.drops[i] = {
                        x: i * this.settings.charSize,
                        y: Math.random() * this.canvas.height,
                        speed: Math.random() * this.settings.speed + 1,
                        char: this.getRandomChar(),
                        opacity: Math.random(),
                        trail: []
                    };
                }
            }

            getRandomChar() {
                return this.chars[Math.floor(Math.random() * this.chars.length)];
            }

            draw() {
                if (this.isPaused) return;

                // Create fading effect with better performance
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.font = `${this.settings.charSize}px 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Courier New', monospace`;
                this.ctx.fillStyle = this.settings.color;

                for (let i = 0; i < this.drops.length; i++) {
                    const drop = this.drops[i];
                    
                    // Add glitch effect
                    if (this.settings.glitch && Math.random() < 0.01) {
                        drop.char = this.getRandomChar();
                    }
                    
                    // Draw character with trail effect
                    this.ctx.globalAlpha = drop.opacity;
                    this.ctx.fillText(drop.char, drop.x, drop.y);
                    
                    // Update position
                    drop.y += drop.speed;
                    
                    // Reset drop when it reaches bottom
                    if (drop.y > this.canvas.height) {
                        drop.y = -this.settings.charSize;
                        drop.char = this.getRandomChar();
                        drop.opacity = Math.random();
                    }
                    
                    // Fade effect
                    drop.opacity -= 0.01 * (this.settings.fadeSpeed / 10);
                    if (drop.opacity <= 0) {
                        drop.opacity = Math.random();
                    }
                }
                
                this.ctx.globalAlpha = 1;
            }

            animate() {
                this.draw();
                this.animationId = requestAnimationFrame(() => this.animate());
            }

            start() {
                if (!this.animationId) {
                    this.animate();
                }
            }

            pause() {
                this.isPaused = !this.isPaused;
                const btn = document.getElementById('pause-btn');
                btn.textContent = this.isPaused ? '▶️ Resume' : '⏸️ Pause';
                btn.classList.toggle('active', this.isPaused);
            }

            lock() {
                this.isLocked = !this.isLocked;
                const btn = document.getElementById('lock-btn');
                btn.textContent = this.isLocked ? '🔓 Unlock' : '🔒 Lock';
                btn.classList.toggle('active', this.isLocked);
                
                if (this.isLocked) {
                    this.pause();
                    this.hideControls();
                } else {
                    this.showControls();
                }
            }

            hideControls() {
                document.querySelector('.controls').style.opacity = '0';
                document.querySelector('.settings-panel').classList.remove('show');
            }

            showControls() {
                document.querySelector('.controls').style.opacity = '0.8';
            }

            setupAutoLock() {
                if (this.settings.autolock) {
                    this.autoLockTimer = setTimeout(() => {
                        this.lock();
                    }, 30000); // 30 seconds
                }
            }

            updateSettings() {
                this.settings.speed = parseInt(document.getElementById('speed-slider').value);
                this.settings.density = parseInt(document.getElementById('density-slider').value);
                this.settings.charSize = parseInt(document.getElementById('size-slider').value);
                this.settings.color = document.getElementById('color-picker').value;
                this.settings.fadeSpeed = parseInt(document.getElementById('fade-slider').value);
                this.settings.glitch = document.getElementById('glitch-checkbox').checked;
                this.settings.autolock = document.getElementById('autolock-checkbox').checked;
                
                // Update display values
                document.getElementById('speed-value').textContent = this.settings.speed;
                document.getElementById('density-value').textContent = this.settings.density;
                document.getElementById('size-value').textContent = this.settings.charSize;
                document.getElementById('fade-value').textContent = this.settings.fadeSpeed;
                
                // Reinitialize drops with new settings
                this.initializeDrops();
                
                // Reset auto-lock timer
                if (this.autoLockTimer) {
                    clearTimeout(this.autoLockTimer);
                }
                this.setupAutoLock();
            }

            setupEventListeners() {
                // Pause/Resume
                document.getElementById('pause-btn').addEventListener('click', () => this.pause());
                
                // Lock/Unlock
                document.getElementById('lock-btn').addEventListener('click', () => this.lock());
                
                // Settings toggle
                document.getElementById('settings-btn').addEventListener('click', () => {
                    const panel = document.getElementById('settings-panel');
                    panel.classList.toggle('show');
                });
                
                // Fullscreen toggle
                document.getElementById('fullscreen-btn').addEventListener('click', () => {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(err => {
                            console.log('Fullscreen not supported');
                        });
                    } else {
                        document.exitFullscreen();
                    }
                });
                
                // Settings sliders
                const sliders = ['speed-slider', 'density-slider', 'size-slider', 'fade-slider'];
                sliders.forEach(id => {
                    document.getElementById(id).addEventListener('input', () => this.updateSettings());
                });
                
                // Color picker
                document.getElementById('color-picker').addEventListener('change', () => this.updateSettings());
                
                // Checkboxes
                document.getElementById('glitch-checkbox').addEventListener('change', () => this.updateSettings());
                document.getElementById('autolock-checkbox').addEventListener('change', () => this.updateSettings());
                
                // Window resize
                window.addEventListener('resize', () => {
                    this.resizeCanvas();
                    this.initializeDrops();
                });
                
                // Orientation change
                window.addEventListener('orientationchange', () => {
                    setTimeout(() => {
                        this.resizeCanvas();
                        this.initializeDrops();
                    }, 100);
                });
                
                // Touch to wake
                document.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (this.isLocked) {
                        this.lock();
                    } else if (this.isPaused) {
                        this.pause();
                    }
                });
                
                // Prevent context menu
                document.addEventListener('contextmenu', (e) => e.preventDefault());
                
                // Prevent scrolling
                document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
                
                // Handle visibility change (iOS 26 specific)
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        this.pause();
                    } else {
                        this.start();
                    }
                });
            }
        }

        // Initialize screensaver when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new MatrixScreensaverIOS26();
            
            // Register service worker for PWA functionality
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('Matrix Screensaver SW: Registered successfully');
                    })
                    .catch((error) => {
                        console.log('Matrix Screensaver SW: Registration failed', error);
                    });
            }
        });

        // Prevent zoom on double tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // iOS 26 specific optimizations
        if (navigator.userAgent.includes('iPhone')) {
            // Optimize for iOS
            document.body.style.webkitTransform = 'translateZ(0)';
            document.body.style.transform = 'translateZ(0)';
            
            // Handle iOS safe areas
            const setSafeAreaInsets = () => {
                const safeAreaTop = window.safeAreaInsets?.top || 0;
                const safeAreaBottom = window.safeAreaInsets?.bottom || 0;
                document.documentElement.style.setProperty('--safe-area-top', `${safeAreaTop}px`);
                document.documentElement.style.setProperty('--safe-area-bottom', `${safeAreaBottom}px`);
            };
            
            setSafeAreaInsets();
            window.addEventListener('resize', setSafeAreaInsets);
        }
    </script>
</body>
</html>
